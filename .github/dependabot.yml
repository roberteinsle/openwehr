# Keeps the dependencies current: one pull request per week and ecosystem with the patch and
# minor updates grouped; security updates come at once (Dependabot security updates, also for
# major versions). Major version jumps of the stack (Laravel, Filament, Vite, FullCalendar …) are
# planned upgrades, not weekly pull requests. Every pull request runs the tests and the security
# checks of the "Build & Deploy" workflow.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # The base image (PHP, nginx, Alpine) of the Dockerfile. PHP stays on 8.4 with its patch releases
  # (security fixes); a new PHP minor version (8.5) is a planned upgrade, tried on the test instance first.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      - dependency-name: serversideup/php
        update-types: [version-update:semver-minor]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies]
