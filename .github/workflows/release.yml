name: Create Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # Hotfix on top of a release, e.g. v0.8.9.1
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: roberteinsle/openwehr

jobs:
  release:
    name: Build Image & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version tag matches config/app.php
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP_VERSION=$(grep -oP "(?<='version' => ')V\.[0-9]+(\.[0-9]+){1,3}(?=')" config/app.php)
          EXPECTED_TAG=$(echo "$APP_VERSION" | sed 's/^V\./v/')
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "ERROR: Tag $TAG does not match version $APP_VERSION in config/app.php"
            echo "Expected tag: $EXPECTED_TAG"
            exit 1
          fi
          echo "Version validated: $APP_VERSION → $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # The tag as it is (v0.8.9 or v0.8.9.1); semver would not take four parts
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE=$(echo "$TAG" | sed 's/^v/V./')
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --latest
          else
            gh release create "$TAG" --title "$TITLE" --generate-notes --latest
          fi
